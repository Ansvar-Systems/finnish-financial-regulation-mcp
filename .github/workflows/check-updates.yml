name: Check Regulatory Data Updates

on:
  schedule:
    # Run monthly on the 1st at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (parse but do not write to DB)"
        required: false
        default: "true"
        type: boolean

jobs:
  check-updates:
    name: Check for new FIN-FSA regulatory data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ingest in dry-run mode
        id: ingest
        run: |
          echo "Checking finanssivalvonta.fi for new regulatory content..."
          npx tsx scripts/ingest-fiva.ts --dry-run 2>&1 | tee ingest-output.txt || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload ingest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: ingest-output.txt
          retention-days: 30

      - name: Report summary
        if: always()
        run: |
          echo "## Data Freshness Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`npm run ingest\` locally or trigger a full rebuild to update the database." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ingest-output.txt >> "$GITHUB_STEP_SUMMARY" || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
